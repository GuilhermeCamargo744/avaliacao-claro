services:
  api:
    build: .
    container_name: team-management-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/team-management
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: team-management-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: team-management
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d team-management']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
